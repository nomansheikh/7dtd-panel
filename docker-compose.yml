services:
  panel:
    image: ghcr.io/nomansheikh/7dtd-panel:latest
    container_name: 7dtd-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # The panel's own database: the admin account, sessions, chat commands,
      # kits and scheduled tasks. Without this, every restart is a fresh
      # install.
      - panel-data:/data
    environment:
      # --- your game server ---------------------------------------------------
      SDTD_HOST: 10.0.0.5
      SDTD_API_PORT: 8080
      SDTD_API_TOKEN_NAME: panel
      SDTD_API_TOKEN_SECRET: change-me

      # --- your panel login ---------------------------------------------------
      PANEL_ADMIN_USERNAME: admin
      PANEL_ADMIN_PASSWORD: change-me-too

      # --- optional -----------------------------------------------------------
      # Set false and the panel refuses shutdown, killall and worldchunkreset
      # everywhere: the console, the world page, chat commands and scheduled
      # tasks alike.
      PANEL_ALLOW_DESTRUCTIVE: "true"
      # Set true only if something in front of this terminates TLS and sets
      # X-Forwarded-For. It decides whether that header is believed.
      PANEL_TRUST_PROXY: "false"

volumes:
  panel-data:
