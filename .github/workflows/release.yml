name: Release

# Tags only. A push to main should not overwrite the image people are running;
# shipping is a deliberate act, and the tag is what makes it one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # arm64 matters here: a good number of these servers run on a Pi or an
      # ARM VPS, and emulating the build is far cheaper than asking them to
      # compile it themselves.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto moves :latest to the highest release tag and leaves it
          # alone for a prerelease, which is what makes v0.1.0-alpha.1 safe to
          # publish: it goes to the registry without becoming what everybody
          # running the compose file from the README pulls tomorrow.
          #
          # The previous `enable={{is_default_branch}}` never fired at all. This
          # workflow only runs on a tag, and a tag ref is not the default
          # branch, so :latest would never have been published — while the
          # quick start in the README pulls exactly that.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
