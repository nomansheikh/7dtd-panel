name: Release

# You tag, this builds. Nothing here decides a version or writes a release —
# pushing the tag is the deliberate act, and this is only the work that follows.
#
# It deliberately does not create the GitHub release. Cutting one in the web UI
# creates the tag, which fires this workflow, which would then try to create a
# release that already exists and fail with a 422 — reporting the whole run as
# failed after the image had already published. Whoever writes the release
# writes it; this publishes the image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # arm64 matters here: plenty of these servers run on a Pi or an ARM VPS,
      # and emulating the build is far cheaper than asking them to compile it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto moves :latest to the highest release and leaves it alone
          # for a prerelease, so v0.1.0-rc.1 can be published and tested without
          # becoming what everybody following the README pulls.
          #
          # The obvious-looking `enable={{is_default_branch}}` does not work
          # here: this only runs on a tag, and a tag ref is never the default
          # branch, so :latest would never have been published at all.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
