openapi: 3.1.0
info:
  title: EntityClass
  version: '1'

components:
  schemas:
    EntityClassElement:
      type: object
      properties:
        name:
          type: string
          examples:
            - zombieArlene
        id:
          type: integer
          examples:
            - -1440238285
        commandId:
          type: integer
          examples:
            - 1
        manualSpawnType:
          type: string
          examples:
            - None
            - Console
            - Menu
      required:
        - name
        - id
        - manualSpawnType

    EntityClassList:
      type: array
      items:
        $ref: '#/components/schemas/EntityClassElement'


paths:
  /api/entityclass:
    get:
      tags:
        - GameData
      summary: EntityClass list
      description: Fetch a list of defined EntityClasses
      operationId: entityclass.get
      responses:
        200:
          description: List of EntityClasses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EntityClassList'
                  meta:
                    $ref: './openapi.yaml#/components/schemas/ResultEnvelopeMeta'
                required:
                  - data
                  - meta
