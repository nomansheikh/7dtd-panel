openapi: 3.1.0
info:
  title: Item
  version: '1'

components:
  schemas:
    ItemElement:
      type: object
      properties:
        name:
          type: string
          examples:
            - woodShapes:VariantHelper
        localizedName:
          type: string
          examples:
            - Wood Block
        isBlock:
          type: boolean
      required:
        - name
        - localizedName
        - isBlock

    ItemList:
      type: array
      items:
        $ref: '#/components/schemas/ItemElement'


paths:
  /api/item:
    get:
      tags:
        - GameData
      summary: Items list
      description: Fetch a list of defined items
      operationId: item.get
      responses:
        200:
          description: List of items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ItemList'
                  meta:
                    $ref: './openapi.yaml#/components/schemas/ResultEnvelopeMeta'
                required:
                  - data
                  - meta
