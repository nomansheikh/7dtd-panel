          type: string
        permissionLevel:
          type: integer
          description: Permission level of the token
      required:
        - name
        - secret
        - permissionLevel
    WebApiTokens_WebApiTokenList:
      type: array
      items:
        $ref: '#/components/schemas/WebApiTokens_WebApiTokenElement'
    WebModules_TypeWebModuleName:
      type: string
    WebModules_TypeWebMethodPermissionEntry:
      oneOf:
        - type: integer
          description: Explicit per method permission level
        - type: string
          description: Inherit the module's global permission level
          enum:
            - 'inherit'
    WebModules_WebModuleElement:
      type: object
      properties:
        module:
          $ref: '#/components/schemas/WebModules_TypeWebModuleName'
        permissionLevelGlobal:
          type: integer
          description: Permission level for the overall module
        permissionLevelPerMethod:
          type: object
          properties:
            GET:
              $ref: '#/components/schemas/WebModules_TypeWebMethodPermissionEntry'
            POST:
              $ref: '#/components/schemas/WebModules_TypeWebMethodPermissionEntry'
            PUT:
              $ref: '#/components/schemas/WebModules_TypeWebMethodPermissionEntry'
            DELETE:
              $ref: '#/components/schemas/WebModules_TypeWebMethodPermissionEntry'
          description: Permission levels per HTTP method
        isDefault:
          type: boolean
          description: Whether this module uses the module's default permissions or the shown values are a user defined override
      required:
        - module
        - permissionLevelGlobal
        - permissionLevelPerMethod
        - isDefault
    WebModules_WebModuleList:
      type: array
      items:
        $ref: '#/components/schemas/WebModules_WebModuleElement'
    WebUsers_TypeWebUserName:
      type: string
    WebUsers_WebUserElement:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/WebUsers_TypeWebUserName'
        platformUserId:
          $ref: '#/components/schemas/TypeUserIdObject'
        crossplatformUserId:
          $ref: '#/components/schemas/TypeUserIdObject'
      required:
        - name
        - platformUserId
        - crossplatformUserId
    WebUsers_WebUserList:
      type: array
      items:
        $ref: '#/components/schemas/WebUsers_WebUserElement'
    Whitelist_WhitelistUserElement:
      type: object
      properties:
        name:
          type: string
          description: Name of the banned player for display purposes. Can be empty.
          example: TheFunPimp
        userId:
          $ref: '#/components/schemas/TypeUserIdObject'
      required:
        - name
        - userId
    Whitelist_WhitelistUserList:
      type: array
      items:
        $ref: '#/components/schemas/Whitelist_WhitelistUserElement'
    Whitelist_WhiteListGroupElement:
      type: object
      properties:
        name:
          type: string
          description: Name of the group for display purposes. Can be empty.
          example: Steam Universe
        groupId:
          type: string
          example: '103582791434672565'
      required:
        - name
        - groupId
    Whitelist_WhiteListGroupList:
      type: array
      items:
        $ref: '#/components/schemas/Whitelist_WhiteListGroupElement'
    Whitelist_UserPermissionsObject:
      type: object
      properties:
        users:
          $ref: '#/components/schemas/Whitelist_WhitelistUserList'
        groups:
          $ref: '#/components/schemas/Whitelist_WhiteListGroupList'
      required:
        - users
        - groups
    Whitelist_TypeGroupIdString:
      type: string
      example: '103582791434672565'
    Whitelist_UserPermissionPostBodyObject:
      type: object
      properties:
        name:
          type: string
  parameters:
    UserIdPathParameter:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TypeUserIdString'
    Command_CommandNameParameter:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Name of command to fetch
    CommandPermissions_CommandNamePathParameter:
      name: command
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CommandPermissions_TypeCommandName'
    ItemIconHandler_IconNameParameter:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Name of icon
    ItemIconHandler_IconTintParameter:
      name: tint
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Z]{6}$'
      description: Tint color of icon as 6 hex digits RGB value
    Log_LogCountParameter:
      name: count
      in: query
      required: false
      schema:
        type: integer
      description: Number of lines to fetch. If negative fetches count lines from the firstLine. Defaults to 50.
    Log_LogFirstLineParameter:
      name: firstLine
      in: query
      required: false
      schema:
        type: integer
      description: First line number to fetch. Defaults to the oldest stored log line if count is positive. Defaults to the most recent log line if count is negative.
    Markers_MarkerIdParameter:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of marker to fetch
    Player_EntityIdParameter:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TypeEntityId'
    RegisterUser_RegisterUserTokenPathParameter:
      name: token
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RegisterUser_TypeRegisterUserName'
    SandboxSettings_SandboxOptionsCodeParameter:
      name: code
      in: query
      required: false
      schema:
        type: string
      description: Sandbox Code to analyze instead of the currently active code on the server.
    SandboxSettings_SandboxOptionsOnlyChangedParameter:
      name: onlyChanged
      in: query
      required: false
      schema:
        type: boolean
      description: Only list options that have non-default value.
    SandboxSettings_SandboxOptionsDetailedParameter:
      name: detailed
      in: query
      required: false
      schema:
        type: boolean
      description: Output more information, like descriptions of settings and the whole range of allowed values per setting.
    UserPermissions_UserIdParameter:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TypeUserIdString'
    UserPermissions_GroupIdParameter:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserPermissions_TypeGroupIdString'
    WebApiTokens_WebApiTokenNamePathParameter:
      name: apiTokenName
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WebApiTokens_TypeWebApiTokenName'
    WebModules_WebModuleNamePathParameter:
      name: moduleName
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WebModules_TypeWebModuleName'
    WebUsers_WebUserNamePathParameter:
      name: userName
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/WebUsers_TypeWebUserName'
    Whitelist_UserIdParameter:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TypeUserIdString'
    Whitelist_GroupIdParameter:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Whitelist_TypeGroupIdString'
  responses:
    HttpEmptyEnvelopedResponse:
      description: Empty result
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  nullable: true
                maxItems: 0
                example: []
              meta:
                $ref: '#/components/schemas/ResultEnvelopeMeta'
            required:
              - data
              - meta
    Unauthorized:
      description: Not authorized to call this operation
    Command_CommandsBodyOut:
      description: Found commands
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/Command_CommandsResult'
              meta:
                $ref: '#/components/schemas/ResultEnvelopeMeta'
            required:
              - data
              - meta
    Markers_MarkersBodyOut:
      description: Found marker
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/Markers_MarkersList'
              meta:
                $ref: '#/components/schemas/ResultEnvelopeMeta'
            required:
              - data
              - meta
    Markers_MarkersIdOut:
      description: Created marker's ID
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: string
                format: uuid
              meta:
                $ref: '#/components/schemas/ResultEnvelopeMeta'
            required:
              - data
              - meta
    SandboxSettings_SandboxOptionsBodyOut:
      description: Sandbox Options
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/SandboxSettings_SandboxOptionsResult'
              meta:
                $ref: '#/components/schemas/ResultEnvelopeMeta'
            required:
              - data
              - meta
  securitySchemes:
    apiTokenName:
      type: apiKey
      in: header
      name: X-SDTD-API-TOKENNAME
      description: Authentication by a "WebToken" with token name and token secret, passed in as header fields. This specifies the token name.
    apiTokenSecret:
      type: apiKey
      in: header
      name: X-SDTD-API-SECRET
      description: Authentication by a "WebToken" with token name and token secret, passed in as header fields. This specifies the token secret.
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: Authentication by session cookie. A cookie can be received from the session endpoints.
  requestBodies:
    Blacklist_BlacklistBodyIn:
      content:
        application/json:
          schema:
            type: object
            properties:
              bannedUntil:
                type: string
                format: date-time
              banReason:
                type: string
                example: Cheating not allowed!
              name:
                type: string
                example: TheFunPimp
            required:
              - bannedUntil
      required: true
    Command_CommandBodyIn:
      content:
        application/json:
          schema:
            type: object
            properties:
              command:
                type: string
                description: Command to be executed, including any arguments
                example: 'settime 1 13 37'
              format:
                type: string
                enum:
                  - Full
                  - Simple
                  - Raw
                description: Expected format of the returned execution result. Full being a full JSON object with info on the executed command and result, simple only returning a JSON object with the execution result and raw returning the execution result as plain text.
            required:
              - command
      required: true
    CommandPermissions_CommandPermissionBodyIn:
      content:
        application/json:
          schema:
            type: object
            properties:
              permissionLevel:
                type: integer
            required:
              - permissionLevel
      required: true
    Markers_MarkersBodyIn:
      content:
        application/json:
          schema:
            type: object
            properties:
              x:
                type: integer
                example: -43
              y:
                type: integer
                example: 842
              name:
                type: string
                example: My House
                nullable: true
              icon:
                type: string
                format: uuid
                example: https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Blue_question_mark_icon.svg/1200px-Blue_question_mark_icon.svg.png
                nullable: true
            required:
              - x
              - y
      required: true
    RegisterUser_RegisterUserBodyIn:
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: string
                format: password
              username:
                type: string
              password:
                type: string
                format: password
            required:
              - token
              - username
              - password
      required: true
    SessionHandler_SessionLoginBodyIn:
      content:
        application/json:
          schema:
            type: object
            properties:
              username:
                type: string
              password:
                type: string
                format: password
            required:
              - username
              - password
      required: true
    UserPermissions_UserPermissionBodyIn:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserPermissions_UserPermissionPostBodyUserObject'
      required: true
    UserPermissions_GroupPermissionBodyIn:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserPermissions_UserPermissionPostBodyGroupObject'
      required: true
    WebApiTokens_WebApiTokenBodyIn:
      content:
        application/json:
          schema:
            type: object
            properties:
              secret:
                type: string
              permissionLevel:
                type: integer
            required:
              - secret
              - permissionLevel
      required: true
    WebModules_WebModuleBodyIn:
      content:
        application/json:
          schema:
            type: object
            properties:
              permissionLevelGlobal:
                type: integer
                description: Permission level for the overall module
              permissionLevelPerMethod:
                type: object
                properties:
                  GET:
                    $ref: '#/components/schemas/WebModules_TypeWebMethodPermissionEntry'
                  POST:
                    $ref: '#/components/schemas/WebModules_TypeWebMethodPermissionEntry'
                  PUT:
                    $ref: '#/components/schemas/WebModules_TypeWebMethodPermissionEntry'
                  DELETE:
                    $ref: '#/components/schemas/WebModules_TypeWebMethodPermissionEntry'
                description: Permission levels per HTTP method
            required:
              - permissionLevelGlobal
              - permissionLevelPerMethod
      required: true
    WebUsers_WebUserBodyIn:
      content:
        application/json:
          schema:
            type: object
            properties:
              password:
                type: string
                format: password
              platformUserId:
                $ref: '#/components/schemas/TypeUserIdObject'
              crossplatformUserId:
                $ref: '#/components/schemas/TypeUserIdObject'
            required:
              - password
              - platformUserId
      required: true
    Whitelist_WhitelistBodyIn:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Whitelist_UserPermissionPostBodyObject'
      required: true
paths:
  /session/login:
    post:
      tags:
        - Session
      summary: Login with web username
      description: Try logging in with a web username/password combination created with the 'createwebuser' command.
      operationId: SessionHandler.get.login
      requestBody:
        $ref: '#/components/requestBodies/SessionHandler_SessionLoginBodyIn'
      responses:
        "200":
          description: Login succeeded, SessionID cookie will be set
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - ''
        "400":
          description: Invalid request
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - 'NoLoginData'
                  - 'InvalidLoginJson'
        "401":
          description: Login failed
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - 'UserPassInvalid'
        "500":
          description: Internal error during login
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - 'LoginError'
  /session/logout:
    get:
      tags:
        - Session
      summary: Logout
      description: Log out from
      operationId: SessionHandler.get.logout
      responses:
        "302":
          description: Logged out, redirect to page base
          headers:
            Location:
              description: Page base URL
              schema:
                type: string
                enum:
                  - '/app'
  /session/loginsteam:
    get:
      tags:
        - Session
      summary: Login with Steam
      description: Log in with Steam's OpenID service
      operationId: SessionHandler.get.loginsteam
      responses:
        "302":
          description: Redirect to Steam's OpenID page
          headers:
            Location:
              description: Steam OpenID URL
              schema:
                type: string
  /session/verifysteamopenid:
    get:
      tags:
        - Session
      summary: Login with Steam - Verification
      description: Callback from Steam's OpenID service, verifying the login result
      operationId: SessionHandler.get.verifysteamopenid
      responses:
        "302":
          description: Redirect to page base or error page
          headers:
            Location:
              description: Page base URL or error page
              schema:
                type: string
                enum:
                  - '/app'
                  - '/app/error/SteamLoginFailed'
  /userstatus:
    get:
      tags:
        - Session
      summary: User status info
      description: Get information about the currently logged in user
      operationId: UserStatusHandler.get
      responses:
        "200":
          description: User status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserStatusHandler_UserStatusElement'
                  meta:
                    $ref: '#/components/schemas/ResultEnvelopeMeta'
                required:
                  - data
                  - meta
      security:
        - {}
        - apiTokenName: []
          apiTokenSecret: []
        - sessionCookie: []
  /itemicons/{name}__{tint}.png:
    get:
      tags:
        - Resources
      summary: ItemIcon get
      description: Get a specific item icon with the given tint
      operationId: ItemIconHandler.get.name
      parameters:
        - $ref: '#/components/parameters/ItemIconHandler_IconNameParameter'
        - $ref: '#/components/parameters/ItemIconHandler_IconTintParameter'
      responses:
        "200":
          description: Item icon with tint
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - ''
        "404":
          description: ItemIcon or tint not found
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - ''
  /api/map/config:
    get:
      tags:
        - Map
      summary: Map info
      description: Get info about the web map
      operationId: Map.get.config
      responses:
        "200":
          description: Map info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Map_MapInfoObject'
                  meta:
                    $ref: '#/components/schemas/ResultEnvelopeMeta'
                required:
                  - data
                  - meta
  /api/command:
    get:
      tags:
        - Commands
      summary: Commands list
      description: Fetch a list of all commands
      operationId: command.get
      responses:
        "200":
          $ref: '#/components/responses/Command_CommandsBodyOut'
    post:
      tags:
        - Commands
      summary: Command execute
      description: Execute a command
      operationId: command.post
      requestBody:
        $ref: '#/components/requestBodies/Command_CommandBodyIn'
      responses:
        "200":
          description: Command executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command_CommandExecutedResponse'
            text/plain:
              schema:
                type: string
                example: 'Set time to 13616'
        "400":
          $ref: '#/components/responses/HttpEmptyEnvelopedResponse'
        "404":
          $ref: '#/components/responses/HttpEmptyEnvelopedResponse'
        "403":
          $ref: '#/components/responses/Unauthorized'
      security:
        - {}
        - apiTokenName: []
          apiTokenSecret: []
        - sessionCookie: []
  /api/command/{name}:
    get:
      tags:
        - Commands
      summary: Command show
      description: Get info on a specific command
      operationId: command.get.id
      parameters:
        - $ref: '#/components/parameters/Command_CommandNameParameter'
      responses:
        "200":
          $ref: '#/components/responses/Command_CommandsBodyOut'
        "404":
          $ref: '#/components/responses/HttpEmptyEnvelopedResponse'
      security:
        - {}
        - apiTokenName: []
          apiTokenSecret: []
        - sessionCookie: []
  /api/log:
    get:
      tags:
        - Log
      summary: Log
      description: Get an amount of lines from the server log
      operationId: log.get
      parameters:
        - $ref: '#/components/parameters/Log_LogCountParameter'
        - $ref: '#/components/parameters/Log_LogFirstLineParameter'
      responses:
        "200":
          description: Log information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Log_LogData'
                  meta:
                    $ref: '#/components/schemas/ResultEnvelopeMeta'
                required:
                  - data
                  - meta
        "403":
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiTokenName: []
          apiTokenSecret: []
        - sessionCookie: []
  /api/OpenAPI/openapi.yaml:
    get:
      tags:
        - Meta
      summary: OpenAPI master document
      description: Fetch the OpenAPI master document, referencing all the individual WebAPI specs
      operationId: OpenAPI.openapi
      responses:
        "200":
          content:
            application/json: {}
          description: OpenAPI master document
  /api/OpenAPI/{name}.openapi.yaml:
    get:
      tags:
        - Meta
      summary: OpenAPI spec for single API
      description: Fetch the OpenAPI spec of a single WebAPI
      operationId: OpenAPI.getAPI
      parameters:
        - in: path
          name: name
          required: true
          schema:
            pattern: '[^\/#\?]+?'
            type: string
      responses:
        "200":
          content:
            application/json: {}
          description: OpenAPI spec for API
        "404":
          content:
            application/json: {}
          description: No OpenAPI spec found for the API name
  /api/animal:
    get:
      tags:
        - WorldState
      summary: Animals list
      description: Fetch a list of the currently spawned (non-hostile) animals in the world
      operationId: animal.get
      responses:
        "200":
          description: List of animals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Animal_AnimalList'
                  meta:
                    $ref: '#/components/schemas/ResultEnvelopeMeta'
                required:
                  - data
                  - meta
        "403":
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiTokenName: []
          apiTokenSecret: []
        - sessionCookie: []
  /api/bloodmoon:
    get:
      tags:
        - WorldState
      summary: Bloodmoon
      description: Get info on the bloodmoon
      operationId: Bloodmoon.get
      responses:
        "200":
          description: Bloodmoon info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Bloodmoon_BloodmoonObject'
                  meta:
                    $ref: '#/components/schemas/ResultEnvelopeMeta'
                required:
                  - data
                  - meta
        "403":
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiTokenName: []
          apiTokenSecret: []
        - sessionCookie: []
  /api/hostile:
    get:
      tags:
        - WorldState
      summary: Hostiles list
      description: Fetch a list of the currently spawned hostiles - including hostile animals - in the world
      operationId: Hostile.get
      responses:
        "200":
          description: List of hostiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Hostile_HostileList'
                  meta:
                    $ref: '#/components/schemas/ResultEnvelopeMeta'
                required:
                  - data
                  - meta
        "403":
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiTokenName: []
          apiTokenSecret: []
        - sessionCookie: []
  /api/player:
    get:
      tags:
        - WorldState
      summary: Players list
      description: Fetch a list of the currently online players. This is restricted to the player of the logged in user when the logged in user does not have the permission to view all players.
      operationId: Player.get
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Player_PlayerResultObject'
                  meta:
                    $ref: '#/components/schemas/ResultEnvelopeMeta'
                required:
                  - data
                  - meta
      security:
        - {}
        - apiTokenName: []
          apiTokenSecret: []
        - sessionCookie: []
  /api/player/{id}:
    get:
      tags:
        - WorldState
      summary: Player get
      description: Fetch the player specified by the given EntityID
      operationId: Player.get.id
      parameters:
        - $ref: '#/components/parameters/Player_EntityIdParameter'
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Player_PlayerResultObject'
                  meta:
                    $ref: '#/components/schemas/ResultEnvelopeMeta'
                required:
                  - data
                  - meta
        "404":
          $ref: '#/components/responses/HttpEmptyEnvelopedResponse'
      security:
        - {}
        - apiTokenName: []
          apiTokenSecret: []
        - sessionCookie: []
  /api/gameprefs:
    get:
      tags:
        - ServerState
      summary: GamePrefs list
      description: Fetch a list of GamePrefs
      operationId: GamePrefs.get
      responses:
        "200":
          description: List of GamePrefs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GamePrefs_GamePrefList'
                  meta:
                    $ref: '#/components/schemas/ResultEnvelopeMeta'
                required:
                  - data
                  - meta
        "403":
          $ref: '#/components/responses/Unauthorized'
      security:
        - apiTokenName: []
          apiTokenSecret: []
